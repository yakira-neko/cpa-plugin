# Multi-arch CPA plugin build & release (workbuddy + qoderwork).
# Each plugin versions INDEPENDENTLY:
#   - tag 'workbuddy-v*'  → release workbuddy at that version
#   - tag 'qoderwork-v*'  → release qoderwork at that version
#   - workflow_dispatch   → pick plugin + version manually
#   - plain push/PR       → CI builds for both (artifacts only, no release)
#
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip   (zip root: <id>.so|.dylib|.dll)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["workbuddy-v*", "qoderwork-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to release"
        required: true
        type: choice
        options: [workbuddy, qoderwork]
      version:
        description: "Version without v (empty = plugin's VERSION file)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: workbuddy
          - dir: qoderwork
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Validate registry.json
        working-directory: .
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # workbuddy native
          - id: workbuddy
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: workbuddy
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: workbuddy
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: workbuddy
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: workbuddy
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
          # qoderwork native
          - id: qoderwork
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: qoderwork
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: qoderwork
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: qoderwork
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: qoderwork
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        working-directory: .
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          # Version resolution: tag of this plugin > dispatch input > VERSION file
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == ${PLUGIN}-v* ]]; then
            VERSION="${GITHUB_REF_NAME#${PLUGIN}-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${PLUGIN}/VERSION)"
            # CI builds (non-release) get a +ci suffix to avoid clashing with real versions
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              VERSION="${VERSION}+ci.${GITHUB_RUN_NUMBER}"
            fi
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${{ matrix.id }}.h" dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "${{ matrix.id }}/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-cross:
    name: ${{ matrix.id }} ${{ matrix.target }} (go-cross)
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: workbuddy
            target: windows-arm64
            ext: dll
          - id: workbuddy
            target: freebsd-amd64
            ext: so
          - id: qoderwork
            target: windows-arm64
            ext: dll
          - id: qoderwork
            target: freebsd-amd64
            ext: so
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == ${PLUGIN}-v* ]]; then
            VERSION="${GITHUB_REF_NAME#${PLUGIN}-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${PLUGIN}/VERSION)"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          GOOS_PART="${{ matrix.target }}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${GOOS_PART%-*}_${GOOS_PART#*-}.zip" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}" >> "${GITHUB_ENV}"

      # FreeBSD is built here rather than by go-cross/cgo-actions: that action
      # hardcodes download.freebsd.org/releases/<arch>/14.3-RELEASE/base.txz in
      # dist/index.js, and FreeBSD removes superseded point releases from the
      # CDN (14.3 was gone by 2026-09-16, leaving 14.4/14.5/15.0/15.1). Every
      # go-cross ref has a dead version pinned (v1.0.1/v1.1.0 → 14.1, v1/main →
      # 14.3), so no tag fixes it. We therefore fetch a sysroot that still
      # exists and cross-compile with the runner's clang + lld.
      - name: Build FreeBSD shared library
        if: matrix.target == 'freebsd-amd64'
        timeout-minutes: 45
        working-directory: ${{ matrix.id }}
        run: |
          set -euo pipefail

          # lld is required to link a FreeBSD target (GNU ld cannot), and the
          # runner image ships clang but not lld.
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang lld
          fi

          # Resolve the newest 14.x release still published, so this does not
          # rot the next time FreeBSD prunes a point release. 14.x is preferred
          # to match the freebsd14 target the plugin declares; anything newer
          # is only used if no 14.x remains. FB_RELEASE can pin it explicitly.
          #
          # Both pipelines end in `|| true` so an empty/renamed listing falls
          # through to the explicit check below instead of aborting inside the
          # substitution (where set -e would give no actionable message).
          if [ -z "${FB_RELEASE:-}" ]; then
            index=$(curl -fsSL https://download.freebsd.org/releases/amd64/)
            FB_RELEASE=$(printf '%s' "$index" \
              | grep -oE '[0-9]+\.[0-9]+-RELEASE' | sort -u -V \
              | grep -E '^14\.' | tail -n1 || true)
            if [ -z "$FB_RELEASE" ]; then
              FB_RELEASE=$(printf '%s' "$index" \
                | grep -oE '[0-9]+\.[0-9]+-RELEASE' | sort -u -V \
                | tail -n1 || true)
            fi
          fi
          if [ -z "$FB_RELEASE" ]; then
            echo "::error::could not determine a FreeBSD release from the CDN listing; set FB_RELEASE to pin one"
            exit 1
          fi
          echo "Using FreeBSD ${FB_RELEASE}"

          curl -fsSL -o base.txz \
            "https://download.freebsd.org/releases/amd64/${FB_RELEASE}/base.txz"
          mkdir -p sysroot
          sudo tar -xf base.txz -C sysroot
          rm -f base.txz

          # CC carrying flags is supported by Go (it splits on spaces), and is
          # exactly what the go-cross action itself did. --target/--sysroot
          # point clang at the downloaded FreeBSD headers and libraries.
          FB_VER="${FB_RELEASE%-RELEASE}"
          mkdir -p "dist/${{ matrix.target }}"
          CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
            CC="clang --target=x86_64-unknown-freebsd${FB_VER} --sysroot=$PWD/sysroot" \
            CGO_LDFLAGS="-fuse-ld=lld" \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${{ matrix.target }}/${LIB_NAME}" .

      - name: Build cross shared library
        if: matrix.target != 'freebsd-amd64'
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: ${{ matrix.id }}
          packages: .
          targets: ${{ matrix.target }}
          out-dir: dist/${{ matrix.target }}
          output: ${{ env.LIB_NAME }}
          flags: -ldflags=-s -w
          x-flags: main.version=${{ steps.meta.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "${{ matrix.id }}/dist/${{ matrix.target }}/${{ matrix.id }}.h" || true
          LIB=""
          for p in \
            "${{ matrix.id }}/dist/${{ matrix.target }}/${LIB_NAME}" \
            "dist/${{ matrix.target }}/${LIB_NAME}" \
            "${{ matrix.id }}/dist/${LIB_NAME}"; do
            if [ -f "$p" ]; then LIB="$p"; break; fi
          done
          if [ -z "$LIB" ]; then
            echo "library not found"; find . -name '*.dll' -o -name '*.so' | head
            exit 1
          fi
          go run ./.github/scripts/package-release.go \
            -library "${LIB}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    # Only for a tag of a specific plugin, or dispatch with a version.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/workbuddy-v') ||
      startsWith(github.ref, 'refs/tags/qoderwork-v')
    needs:
      - build
      - build-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin + version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="${{ github.event.inputs.plugin }}"
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == workbuddy-v* ]]; then
            P="workbuddy"; V="${GITHUB_REF_NAME#workbuddy-v}"
          else
            P="qoderwork"; V="${GITHUB_REF_NAME#qoderwork-v}"
          fi
          echo "plugin=$P" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${P}-v${V}" >> "$GITHUB_OUTPUT"
          echo "Releasing $P v$V"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/${PLUGIN}_${VERSION}_*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            sort out/*.sha256 > out/checksums.txt
          else
            (cd out && sha256sum *.zip > checksums.txt)
          fi
          cat out/checksums.txt
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            test -f "out/${PLUGIN}_${VERSION}_${t}.zip" || { echo "missing ${PLUGIN}_${VERSION}_${t}.zip"; exit 1; }
          done

      - name: Sync registry.json version (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pid, v = os.environ["PLUGIN"], os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text())
          for plug in data.get("plugins", []):
              if plug.get("id") == pid:
                  plug["version"] = v
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY
          python3 scripts/validate-registry.py registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release ${PLUGIN} ${TAG}"
              git push origin "${TAG}"
            fi
          fi
          NOTES=$(cat <<EOF
          ## ${PLUGIN} CPA plugin v${VERSION}

          Multi-arch builds for [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) plugin store (\`github-release\` install type).

          ### Assets (pluginstore \`ArchiveName(id, version, goos, goarch)\`)
          | File | Contents |
          |---|---|
          | \`${PLUGIN}_${VERSION}_linux_amd64.zip\` | \`${PLUGIN}.so\` |
          | \`${PLUGIN}_${VERSION}_linux_arm64.zip\` | \`${PLUGIN}.so\` |
          | \`${PLUGIN}_${VERSION}_darwin_amd64.zip\` | \`${PLUGIN}.dylib\` |
          | \`${PLUGIN}_${VERSION}_darwin_arm64.zip\` | \`${PLUGIN}.dylib\` |
          | \`${PLUGIN}_${VERSION}_windows_amd64.zip\` | \`${PLUGIN}.dll\` |
          | \`${PLUGIN}_${VERSION}_windows_arm64.zip\` | \`${PLUGIN}.dll\` |
          | \`${PLUGIN}_${VERSION}_freebsd_amd64.zip\` | \`${PLUGIN}.so\` |
          | \`checksums.txt\` | SHA256 of zips |

          ### Manual install (linux/amd64 example)
          \`\`\`bash
          unzip ${PLUGIN}_${VERSION}_linux_amd64.zip
          cp ${PLUGIN}.so /path/to/cliproxyapi/plugins/${PLUGIN}.so
          \`\`\`

          ### Remote update (custom plugin source)
          \`\`\`
          https://raw.githubusercontent.com/Sliverkiss/cpa-plugin/main/registry.json
          \`\`\`
          EOF
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/${PLUGIN}_*.zip out/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/${PLUGIN}_*.zip out/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${PLUGIN} v${VERSION}" \
              --notes "${NOTES}"
          fi
